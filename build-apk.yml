name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Navigate to project folder and build
      run: |
        # التأكد من الدخول إلى مجلد المشروع إذا كان داخلياً
        if [ -d "lecture-log/UT lecture-log" ]; then
          cd "lecture-log/UT lecture-log"
        elif [ -d "lecture-log" ]; then
          cd "lecture-log"
        fi
        
        # توليد الـ Gradle Wrapper إذا لم يكن موجوداً
        gradle wrapper || true
        
        # منح الصلاحيات والبناء
        chmod +x gradlew || true
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
